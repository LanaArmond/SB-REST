server:
  port: 8888

cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br

file:
  upload-dir: /home/lana/uploadDir

spring:
  application:
    name: SB-REST

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB

logging:
  level:
    root: INFO

spring-doc:
  paths-to-match: /api/**/**
  swagger-ui:
    use-root-path: true