spring:

  application:
    name: SB-REST

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_sb?useTimezone=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size:  215MB

file:
  upload-dir: /home/lana/uploadDir

security:
  jwt:
    token:
      secret-key: 53cr37
      expire-lenght: 3600000 # 1H

email:
  subject: "Default Subject"
  message: "Default Message"

server:
  port: 80

cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br

logging:
  level:
    # br.com.javastudies.sbrest: DEBUG
    root: INFO

spring-doc:
  paths-to-match:
    - /auth/**
    - /api/**/**
  swagger-ui:
    use-root-path: true