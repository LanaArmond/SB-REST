spring:

  application:
    name: SB-REST

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_sb?useTimezone=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size:  215MB

file:
  upload-dir: /home/lana/uploadDir

cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br

logging:
  level:
    # br.com.javastudies.sbrest: DEBUG
    root: INFO

spring-doc:
  paths-to-match: /api/**/**
  swagger-ui:
    use-root-path: true