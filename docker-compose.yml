services:

  db:
    image: mysql:9.1.0
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: docker
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: rest_sb
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - sbrest-network

  sb_rest_api:
    image: lanaarmond/sb_rest_api
    restart: always
    build: .
    working_dir: /SB-REST
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/rest_sb?useTimezone=true&serverTimezone=UTC
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: root
    command: mvn spring-boot:run
    depends_on:
      - db
    ports:
      - 80:80
    networks:
      - sbrest-network

  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - - portainer_data:data
    networks:
      - sbrest-network

volumes:
  portainer_data:

networks:
  sbrest-network:
    driver: bridge

